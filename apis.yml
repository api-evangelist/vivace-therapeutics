description: Vivace Therapeutics is a clinical-stage, oncology-focused biotechnology company based in the
  San Francisco Bay Area, developing small-molecule cancer therapeutics that target the Hippo-YAP signaling
  pathway. Its lead candidate, VT3989, is in clinical trials for mesothelioma and other solid tumors. The
  company was surfaced as a portfolio company of Canaan Partners and added to the API Evangelist network.
  As a private therapeutics developer, Vivace publishes clinical-trial, scientific-publication, and corporate
  content, but exposes no public developer portal, API, SDK, documentation, or code repositories.
